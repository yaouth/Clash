# ==========================================================
# Mihomo / Clash 配置
# ==========================================================

# =========================
# 基础配置
# =========================
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# =========================
# 机场节点订阅
# =========================
proxy-providers:
  Kuromis:
    type: http
    url: "机场地址"
    interval: 3600
    proxy: DIRECT
    path: ./providers/Kuromis.yaml

    # 排除机场展示/说明/流量/到期等非节点项目
    exclude-filter: '(?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)'

    header:
      User-Agent:
        - clash-verge/v2.4.5

    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

    override:
      skip-cert-verify: true
      udp: true

# =========================
# 策略组
# =========================
proxy-groups:

  # --------------------------------------------------------

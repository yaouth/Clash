  # --------------------------------------------------------
  # 通用出口
  # --------------------------------------------------------

  - name: 🚀 手动
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🧊 冷门
      - 🧭 全部
      - ♻️ 自动
      - DIRECT

  # 默认出口：允许进入完整节点池
  - name: 🌐 默认
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🧊 冷门
      - 🧭 全部
      - ♻️ 自动
      - DIRECT

  # 最终兜底策略组
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🌐 默认
      - DIRECT
      - ♻️ 自动
      - 🧊 冷门
      - 🚀 手动

  # 非标准端口流量
  - name: 🔀 非标端口
    type: select
    proxies:
      - 🐟 遵循规则
      - DIRECT

  # 将非标准端口流量重新交给漏网之鱼处理
  - name: 🐟 遵循规则
    type: select
    proxies:
      - 🐟 漏网之鱼

  # --------------------------------------------------------
  # 完整节点池
  # --------------------------------------------------------

  # 全部机场节点
  - name: 🧭 全部
    type: select
    use:
      - Kuromis
    filter: ".*"

  # 全部机场节点自动测速
  - name: ♻️ 自动
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: ".*"

  # --------------------------------------------------------
  # 地区自动测速
  # --------------------------------------------------------

  - name: 🇭🇰 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇭🇰|香港|\bHK\b|hong[\s_-]?kong)'

  - name: 🇹🇼 台湾
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)'

  - name: 🇯🇵 日本
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇯🇵|日本|\bJP\b|japan|tokyo|osaka)'

  - name: 🇸🇬 新加坡
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'

  - name: 🇺🇸 美国
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇺🇸|美国|\bUS\b|united[\s_-]?states|los[\s_-]?angeles|san[\s_-]?jose|seattle|new[\s_-]?york)'

  # 冷门 = 排除五大主要地区后剩余的全部节点
  - name: 🧊 冷门
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)^(?!.*(🇭🇰|香港|\bHK\b|hong[\s_-]?kong|🇯🇵|日本|\bJP\b|japan|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united[\s_-]?states|los[\s_-]?angeles|san[\s_-]?jose|seattle|new[\s_-]?york)).*'


# ==========================================================
# 路由规则
# ==========================================================
# ==========================================================
# 路由规则
# ==========================================================

rules:

  # 1. Adobe
  - RULE-SET,rs_adobe,🎨 Adobe

  # 2. 私有地址：域名 + IP
  - RULE-SET,rs_private_domain,DIRECT
  - RULE-SET,rs_private_ip,DIRECT,no-resolve

  # 3. 自定义直连规则
  - RULE-SET,Custom_Direct_Domain,DIRECT
  - RULE-SET,Custom_Direct_Classical_IP,DIRECT

  # 4. 自定义代理规则
  - RULE-SET,Custom_Proxy_Domain,🚀 手动
  - RULE-SET,Custom_Proxy_Classical_IP,🚀 手动

  # 5. 中国大陆：域名 + IP
  - RULE-SET,rs_cn_domain,DIRECT
  - RULE-SET,rs_cn_ip,DIRECT,no-resolve

  # 6. 中国可用 / 游戏 / PT
  - RULE-SET,rs_google_cn,DIRECT
  - RULE-SET,rs_category_games_cn,DIRECT
  - RULE-SET,rs_category_public_tracker,DIRECT

  # 7. AI
  - RULE-SET,rs_category_ai_not_cn,🤖 AI
  - RULE-SET,rs_google_gemini,🤖 AI
  - RULE-SET,rs_openai,🤖 AI

  # 8. Apple
  - RULE-SET,rs_apple,🍎 Apple

  # 9. Cloudflare
  - RULE-SET,rs_cloudflare,☁️ Cloudflare

  # 10. 游戏
  - RULE-SET,rs_steam,🎮 Game
  - RULE-SET,rs_epicgames,🎮 Game
  - RULE-SET,rs_ea,🎮 Game
  - RULE-SET,rs_blizzard,🎮 Game
  - RULE-SET,rs_ubisoft,🎮 Game
  - RULE-SET,rs_playstation,🎮 Game
  - RULE-SET,rs_nintendo,🎮 Game

  # 11. GitHub
  - RULE-SET,rs_github,🧑‍💻 GitHub

  # 12. Google
  - RULE-SET,rs_google,🔎 Google

  # 13. Instagram
  - RULE-SET,rs_instagram,📸 Instagram

  # 14. 流媒体
  - RULE-SET,rs_youtube,🎬 Media
  - RULE-SET,rs_netflix,🎬 Media
  - RULE-SET,rs_disney,🎬 Media
  - RULE-SET,rs_hbo,🎬 Media
  - RULE-SET,rs_amazon,🎬 Media
  - RULE-SET,rs_spotify,🎬 Media

  # 15. Microsoft
  - RULE-SET,rs_microsoft,🪟 Microsoft

  # 16. Telegram
  - RULE-SET,rs_telegram,📨 Telegram

  # 17. Speedtest
  - RULE-SET,rs_category_speedtest,🚝 Test

  # 18. TikTok
  - RULE-SET,rs_tiktok,🎵 TikTok

  # 19. 社交 / 即时通讯
  - RULE-SET,rs_category_communication,📞 社交
  - RULE-SET,rs_twitter,📞 社交
  - RULE-SET,rs_category_social_not_cn,📞 社交

  # 20. 虚拟币
  - RULE-SET,rs_okx,👌 虚拟币
  - RULE-SET,rs_binance,👌 虚拟币
  - RULE-SET,rs_bybit,👌 虚拟币

  # 21. GFW
  - RULE-SET,rs_gfw,🚀 手动

  # 22. 非标准端口
  - RULE-SET,Custom_Port_Direct,🔀 非标端口

  # 23. 最终兜底
  # MATCH 不能也不应该改成 RULE-SET；它本身就是最终兜底匹配。
  - MATCH,🐟 漏网之鱼



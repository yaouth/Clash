# ==========================================================
# 机场节点订阅
# ==========================================================
proxy-providers:

  Provider_Name:
    url: "机场地址"
    type: http
    interval: 86400
    filter: ".*"
    exclude-filter: "Traffic Reset|Expire Date|GB"

    health-check:
      enable: true
      url: "http://www.gstatic.com/generate_204"
      interval: 300

    proxy: ➡️ 直连


# ==========================================================
# 本地代理
# ==========================================================
proxies:

  - name: ➡️ 直连
    type: direct

  - name: ⛔ 拒绝
    type: reject


# ==========================================================
# 锚点：业务分流组
#
# 注意：
# 这里故意不放 use: Provider_Name
#
# 业务组只能看到：
# 直连 / 地区 / 冷门 / 手动 / 自动 / 默认 / 拒绝
#
# 不直接暴露机场全部节点，避免业务组越权。
# ==========================================================
default: &default
  type: select
  proxies:
    - ➡️ 直连
    - 🇭🇰 香港
    - 🇹🇼 台湾
    - 🇯🇵 日本
    - 🇸🇬 新加坡
    - 🇺🇸 美国
    - 🧊 冷门
    - 🧭 手动
    - ♻️ 自动
    - 🌐 默认
    - ⛔ 拒绝


# ==========================================================
# 锚点：地区自动测速
# ==========================================================
region-test: &region-test
  type: url-test
  url: "http://www.gstatic.com/generate_204"
  interval: 300
  tolerance: 50
  lazy: true
  use:
    - Provider_Name


# ==========================================================
# 策略组
# ==========================================================
proxy-groups:

  # ========================================================
  # 应用 / 业务策略组
  # ========================================================

  - name: 🤖 AI
    <<: *default

  - name: 🍎 Apple
    <<: *default

  - name: ☁️ Cloudflare
    <<: *default

  - name: 🧑‍💻 GitHub
    <<: *default

  - name: 🎮 Games
    <<: *default

  - name: 🔎 Google
    <<: *default

  - name: 🪟 Microsoft
    <<: *default

  - name: 🎬 Media
    <<: *default

  - name: 📨 Telegram
    <<: *default

  - name: 📸 Instagram
    <<: *default

  - name: 📞 即时通讯
    <<: *default

  - name: 💬 社交媒体
    <<: *default

  - name: 🚝 测速工具
    <<: *default

  - name: 👌 虚拟币
    <<: *default

  - name: 🎨 Adobe
    <<: *default


  # ========================================================
  # 通用出口选择
  #
  # 不直接 use Provider_Name
  # 通过下面的地区 / 自动 / 手动组间接使用节点
  # ========================================================
  - name: 🚀 手动
    type: select
    proxies:
      - ♻️ 自动
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🧊 冷门
      - 🧭 手动
      - ➡️ 直连
      - ⛔ 拒绝


  # ========================================================
  # 默认策略
  #
  # 这里不能继承 &default
  # 否则容易形成：
  #
  # 🌐 默认 -> default -> 🌐 默认
  #
  # 的循环引用。
  # ========================================================
  - name: 🌐 默认
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🧊 冷门
      - ♻️ 自动
      - 🧭 手动
      - ➡️ 直连
      - ⛔ 拒绝


  # ========================================================
  # 手动节点
  #
  # 唯一直接看到 Provider_Name 全部节点的手动组
  # ========================================================
  - name: 🧭 手动
    type: select
    use:
      - Provider_Name


  # ========================================================
  # 全节点自动测速
  # ========================================================
  - name: ♻️ 自动
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    use:
      - Provider_Name


  # ========================================================
  # 香港
  # ========================================================
  - name: 🇭🇰 香港
    <<: *region-test
    filter: '(?i)(香港|HK|Hong[\s_-]?Kong)'


  # ========================================================
  # 台湾
  # ========================================================
  - name: 🇹🇼 台湾
    <<: *region-test
    filter: '(?i)(台湾|TW|Taiwan|Taipei|Hinet)'


  # ========================================================
  # 日本
  # ========================================================
  - name: 🇯🇵 日本
    <<: *region-test
    filter: '(?i)(日本|JP|Japan|Tokyo|Osaka)'


  # ========================================================
  # 新加坡
  # ========================================================
  - name: 🇸🇬 新加坡
    <<: *region-test
    filter: '(?i)(新加坡|SG|Singapore)'


  # ========================================================
  # 美国
  # ========================================================
  - name: 🇺🇸 美国
    <<: *region-test
    filter: '(?i)(美国|US|United[\s_-]?States|Los[\s_-]?Angeles|San[\s_-]?Jose|Seattle|New[\s_-]?York)'


  # ========================================================
  # 冷门地区
  #
  # 排除：
  # 香港 / 台湾 / 日本 / 新加坡 / 美国
  #
  # 剩余节点进入冷门池
  # ========================================================
  - name: 🧊 冷门
    <<: *region-test
    filter: '^(?!.*(?i)(香港|HK|Hong[\s_-]?Kong|台湾|TW|Taiwan|Taipei|Hinet|日本|JP|Japan|Tokyo|Osaka|新加坡|SG|Singapore|美国|US|United[\s_-]?States|Los[\s_-]?Angeles|San[\s_-]?Jose|Seattle|New[\s_-]?York)).*'


  # ========================================================
  # 最终兜底
  # ========================================================
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🌐 默认
      - ♻️ 自动
      - 🧊 冷门
      - 🧭 手动
      - 🚀 手动
      - ➡️ 直连


  # ========================================================
  # 非标准端口
  # ========================================================
  - name: 🔀 非标端口
    type: select
    proxies:
      - 🪐 遵循规则
      - ➡️ 直连


  # ========================================================
  # 遵循规则
  # ========================================================
  - name: 🪐 遵循规则
    type: select
    proxies:
      - 🐟 漏网之鱼


# ==========================================================
# Rules
#
# 顺序非常重要：
#
# 1. Adobe
# 2. 私有地址
# 3. 自定义直连
# 4. 中国大陆
# 5. 国内可用服务
# 6. 各业务应用
# 7. 自定义代理
# 8. GFW
# 9. 非标准端口
# 10. 最终漏网
# ==========================================================
rules:

  # ========================================================
  # Adobe
  # ========================================================
  - GEOSITE,adobe,🎨 Adobe
    #- GEOIP,adobe,🎨 Adobe,no-resolve


  # ========================================================
  # Private
  # ========================================================
  - GEOSITE,private,➡️ 直连
  - GEOIP,private,➡️ 直连,no-resolve


  # ========================================================
  # Aethersailor 自定义直连
  # ========================================================
  - RULE-SET,Custom_Direct_Domain,➡️ 直连
  - RULE-SET,Custom_Direct_Classical_IP,➡️ 直连


  # ========================================================
  # 中国大陆
  # ========================================================
  - GEOSITE,cn,➡️ 直连
  - GEOIP,cn,➡️ 直连,no-resolve

  # ========================================================
  # 国内可用 / 下载 / BT
  # ========================================================
  - GEOSITE,google-cn,➡️ 直连
  - GEOSITE,category-games@cn,➡️ 直连
  - GEOSITE,category-game-platforms-download,➡️ 直连
  - GEOSITE,category-public-tracker,➡️ 直连

  # ========================================================
  # Telegram
  # ========================================================
  - GEOSITE,telegram,📨 Telegram
  - GEOIP,telegram,📨 Telegram,no-resolve

  # ========================================================
  # AI
  # ========================================================
  - GEOSITE,openai,🤖 AI

  # ========================================================
  # Apple
  # ========================================================
  - GEOSITE,apple,🍎 Apple

  # ========================================================
  # Media
  # ========================================================
  - GEOSITE,youtube,🎬 Media
  - GEOSITE,tiktok,🎬 Media
  - GEOSITE,netflix,🎬 Media
  - GEOSITE,crunchyroll,🎬 Media
  - GEOSITE,disney,🎬 Media
  - GEOSITE,hbo,🎬 Media
  - GEOSITE,amazon,🎬 Media
  - GEOSITE,spotify,🎬 Media

  # ========================================================
  # Instagram
  # ========================================================
  - GEOSITE,instagram,📸 Instagram

  # ========================================================
  # GitHub
  # ========================================================
  - GEOSITE,github,🧑‍💻 GitHub
    #- GEOIP,github,🧑‍💻 GitHub,no-resolve

  # ========================================================
  # Speedtest
  # ========================================================
  - GEOSITE,speedtest,🚝 测速工具

  # ========================================================
  # Games
  # ========================================================
  - GEOSITE,steam,🎮 Games
  - GEOSITE,epicgames,🎮 Games
  - GEOSITE,ea,🎮 Games
  - GEOSITE,blizzard,🎮 Games
  - GEOSITE,ubisoft,🎮 Games
  - GEOSITE,playstation,🎮 Games
  - GEOSITE,nintendo,🎮 Games

  # ========================================================
  # 虚拟币
  # ========================================================
  - GEOSITE,okx,👌 虚拟币
  - GEOSITE,binance,👌 虚拟币
  - GEOSITE,bybit,👌 虚拟币

  # ========================================================
  # 即时通讯
  # ========================================================
  - GEOSITE,category-communication,📞 即时通讯

  # ========================================================
  # 社交媒体
  # ========================================================
  - GEOSITE,category-social-media-!cn,💬 社交媒体
  - GEOSITE,twitter,💬 社交媒体

  # ========================================================
  # Google
  # ========================================================
  - GEOSITE,google,🔎 Google
  - GEOIP,google,🔎 Google,no-resolve

  # ========================================================
  # Microsoft
  # ========================================================
  - GEOSITE,microsoft,🪟 Microsoft
    #- GEOIP,microsoft,🪟 Microsoft,no-resolve

  # ========================================================
  # Cloudflare
  # ========================================================
  - GEOSITE,cloudflare,☁️ Cloudflare
  - GEOIP,cloudflare,☁️ Cloudflare,no-resolve

  # ========================================================
  # Aethersailor 自定义代理
  # ========================================================
  - RULE-SET,Custom_Proxy_Domain,🚀 手动
  - RULE-SET,Custom_Proxy_Classical_IP,🚀 手动

  # ========================================================
  # GFW
  # ========================================================
  - GEOSITE,gfw,🚀 手动

  # ========================================================
  # 非标准端口
  #
  # 放在 GFW 后面：
  # 只有前面的规则都没有命中时才进入这里。
  # ========================================================
  - RULE-SET,Custom_Port_Direct,🔀 非标端口

  # ========================================================
  # 最终兜底
  # ========================================================
  - MATCH,🐟 漏网之鱼


# ==========================================================
# Rule Providers
# ==========================================================
rule-providers:

  Custom_Direct_Domain:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml"
    path: ./ruleset/Custom_Direct_Domain.yaml
    interval: 28800

  Custom_Direct_Classical_IP:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml"
    path: ./ruleset/Custom_Direct_Classical_IP.yaml
    interval: 28800

  Custom_Proxy_Domain:
    type: http
    behavior: domain
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml"
    path: ./ruleset/Custom_Proxy_Domain.yaml
    interval: 28800

  Custom_Proxy_Classical_IP:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml"
    path: ./ruleset/Custom_Proxy_Classical_IP.yaml
    interval: 28800

  Custom_Port_Direct:
    type: http
    behavior: classical
    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"
    path: ./ruleset/Custom_Port_Direct.yaml
    interval: 28800

  # 最终兜底策略组
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🌐 默认
      - DIRECT
      - ♻️ 自动
      - 🧊 冷门
      - 🚀 手动

  # 非标准端口流量
  - name: 🔀 非标端口
    type: select
    proxies:
      - 🐟 遵循规则
      - DIRECT

  # 将非标准端口流量重新交给漏网之鱼处理
  - name: 🐟 遵循规则
    type: select
    proxies:
      - 🐟 漏网之鱼

  # --------------------------------------------------------
  # 完整节点池
  # --------------------------------------------------------

  # 全部机场节点
  - name: 🧭 全部
    type: select
    use:
      - Kuromis
    filter: ".*"

  # 全部机场节点自动测速
  - name: ♻️ 自动
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: ".*"

  # --------------------------------------------------------
  # 地区自动测速
  # --------------------------------------------------------

  - name: 🇭🇰 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇭🇰|香港|\bHK\b|hong[\s_-]?kong)'

  - name: 🇹🇼 台湾
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet)'

  - name: 🇯🇵 日本
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇯🇵|日本|\bJP\b|japan|tokyo|osaka)'

  - name: 🇸🇬 新加坡
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇸🇬|新加坡|\bSG\b|singapore)'

  - name: 🇺🇸 美国
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)(🇺🇸|美国|\bUS\b|united[\s_-]?states|los[\s_-]?angeles|san[\s_-]?jose|seattle|new[\s_-]?york)'

  # 冷门 = 排除五大主要地区后剩余的全部节点
  - name: 🧊 冷门
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true
    use:
      - Kuromis
    filter: '(?i)^(?!.*(🇭🇰|香港|\bHK\b|hong[\s_-]?kong|🇯🇵|日本|\bJP\b|japan|tokyo|osaka|🇹🇼|台湾|\bTW\b|taiwan|taipei|hinet|🇸🇬|新加坡|\bSG\b|singapore|🇺🇸|美国|\bUS\b|united[\s_-]?states|los[\s_-]?angeles|san[\s_-]?jose|seattle|new[\s_-]?york)).*'


# ==========================================================
# 路由规则
# ==========================================================

rules:

  # 1. Adobe
  - GEOSITE,adobe,🎨 Adobe

  # 2. 私有地址直连
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 3. 自定义直连规则
  - RULE-SET,Custom_Direct_Domain,DIRECT
  - RULE-SET,Custom_Direct_Classical_IP,DIRECT

  # 4. 自定义代理规则
  - RULE-SET,Custom_Proxy_Domain,🚀 手动
  - RULE-SET,Custom_Proxy_Classical_IP,🚀 手动

  # 5. 中国大陆直连
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT,no-resolve

  # 6. 中国可用 / 游戏 / PT 等直连
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games!cn,DIRECT
  - GEOSITE,category-public-tracker,DIRECT

  # 7. AI
  - GEOSITE,category-ai-!cn,🤖 AI
  - GEOSITE,google-gemini,🤖 AI
  - GEOSITE,openai,🤖 AI

  # 8. Apple
  - GEOSITE,apple,🍎 Apple

  # 9. Cloudflare
  - GEOSITE,cloudflare,☁️ Cloudflare

  # 10. 游戏
  - GEOSITE,steam,🎮 Game
  - GEOSITE,epicgames,🎮 Game
  - GEOSITE,ea,🎮 Game
  - GEOSITE,blizzard,🎮 Game
  - GEOSITE,ubisoft,🎮 Game
  - GEOSITE,playstation,🎮 Game
  - GEOSITE,nintendo,🎮 Game

  # 11. GitHub
  - GEOSITE,github,🧑‍💻 GitHub

  # 12. Google
  - GEOSITE,google,🔎 Google

  # 13. Instagram
  - GEOSITE,instagram,📸 Instagram

  # 14. 流媒体
  - GEOSITE,youtube,🎬 Media
  - GEOSITE,netflix,🎬 Media
  - GEOSITE,disney,🎬 Media
  - GEOSITE,hbo,🎬 Media
  - GEOSITE,amazon,🎬 Media
  - GEOSITE,spotify,🎬 Media

  # 15. Microsoft
  - GEOSITE,microsoft,🪟 Microsoft

  # 16. Telegram
  - GEOSITE,telegram,📨 Telegram

  # 17. Speedtest
  - GEOSITE,category-speedtest,🚝 Test

  # 18. TikTok
  - GEOSITE,tiktok,🎵 TikTok

  # 19. 社交 / 即时通讯
  - GEOSITE,category-communication,📞 社交
  - GEOSITE,twitter,📞 社交
  - GEOSITE,category-social-media-!cn,📞 社交

  # 20. 虚拟币
  - GEOSITE,okx,👌 虚拟币
  - GEOSITE,binance,👌 虚拟币
  - GEOSITE,bybit,👌 虚拟币

  # 21. GFW
  - GEOSITE,gfw,🚀 手动

  # 22. 非标准端口
  - RULE-SET,Custom_Port_Direct,🔀 非标端口

  # 23. 最终兜底
  - MATCH,🐟 漏网之鱼


# ==========================================================
# Rule Provider
# ==========================================================

rule-providers:

  # 自定义直连域名
  Custom_Direct_Domain:
    type: http
    behavior: domain
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml
    path: ./providers/Custom_Direct_Domain-domain-0eeac228cc645745.yaml
    format: yaml
    interval: 28800

  # 自定义直连 IP
  Custom_Direct_Classical_IP:
    type: http
    behavior: classical
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml
    path: ./providers/Custom_Direct_Classical_IP-classical-ed5023c070be734c.yaml
    format: yaml
    interval: 28800

  # 自定义代理域名
  Custom_Proxy_Domain:
    type: http
    behavior: domain
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml
    path: ./providers/Custom_Proxy_Domain-domain-4550d05f9c37fb80.yaml
    format: yaml
    interval: 28800

  # 自定义代理 IP
  Custom_Proxy_Classical_IP:
    type: http
    behavior: classical
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP-classical-d4bee5f66bad33e9.yaml
    path: ./providers/Custom_Proxy_Classical_IP-classical-d4bee5f66bad33e9.yaml
    format: yaml
    interval: 28800

  # 非标准端口直连
  Custom_Port_Direct:
    type: http
    behavior: classical
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml
    path: ./providers/Custom_Port_Direct-classical-7ee9d14c928a5f30.yaml
    format: yaml
    interval: 28800

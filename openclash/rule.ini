[custom]

; ==========================================================
; 基础配置
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点过滤
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 策略组公共变量
; ==========================================================
DEFAULT_GROUPS=[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认`[]REJECT

; ==========================================================
; RULE-SET 直连规则
; ==========================================================

; --------------------------
; 局域网
; --------------------------
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan_Domain.list,86400

; --------------------------
; 中国大陆域名
; --------------------------
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Domain.list,86400

; --------------------------
; 中国大陆 IP
; --------------------------
ruleset=DIRECT,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaIPs/ChinaIPs_IP.list,86400

; --------------------------
; Google 中国服务

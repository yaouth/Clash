[custom]
; ==========================================================
; 启用规则集
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOIP,adobe,no-resolve
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 核心应用 ---
ruleset=📦 Notion,[]GEOSITE,notion
ruleset=📦 Notion,[]GEOIP,notion,no-resolve

ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve

; --- AI ---
ruleset=🤖 AI,[]GEOSITE,openai

; --- Apple ---
ruleset=🍎 Apple,[]GEOSITE,apple

; --- 视频媒体 ---
ruleset=🎬 流媒体,[]GEOSITE,youtube
ruleset=🎬 流媒体,[]GEOSITE,netflix
ruleset=🎬 流媒体,[]GEOIP,netflix,no-resolve
ruleset=🎬 流媒体,[]GEOSITE,disney
ruleset=🎬 流媒体,[]GEOSITE,hbo

; --- 海外主流应用补充 ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=🎵 TikTok,[]GEOIP,tiktok,no-resolve
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🧑‍💻 GitHub,[]GEOIP,github,no-resolve
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest

; ---游戏机关 ---
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 金融交易 ---
ruleset=👌 虚拟币,[]GEOSITE,okx
ruleset=👌 虚拟币,[]GEOSITE,binance
ruleset=👌 虚拟币,[]GEOSITE,bybit
; ==========================================================
; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn

; --- Google / Microsoft / Cloudflare ---
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,[]GEOIP,microsoft,no-resolve

ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ Cloudflare,[]GEOIP,cloudflare,no-resolve

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
;    说明：每个应用都加入「🧊 冷门」可选
; ==========================================================
custom_proxy_group=📦 Notion`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]DIRECT`[]🌐 默认
custom_proxy_group=🍎 Apple`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]DIRECT`[]🌐 默认
custom_proxy_group=🤖 AI`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=📨 Telegram`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=📞 即时通讯`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=💬 社交媒体`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认

custom_proxy_group=🎬 流媒体`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认

custom_proxy_group=🎵 TikTok`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=📸 Instagram`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=🐦 X`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认

custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认

custom_proxy_group=👌 虚拟币`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]DIRECT`[]🧭 手动`[]♻️ 自动`[]🌐 默认

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]DIRECT`[]REJECT`[]🌐 默认
custom_proxy_group=🔎 Google`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
custom_proxy_group=☁️ Cloudflare`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认
; Microsoft：允许直连优先，同时也能选五区/冷门/Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]♻️ 自动`[]🧭 手动`[]🌐 默认

; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
;    同时新增：🧊 冷门（只收非 HK/JP/TW/US/SG 的节点）
; ==========================================================

; 兜底“手动选择”（不越权应用，只用于 Default/漏网）
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]DIRECT

; 默认出口（同样允许冷门节点参与）
custom_proxy_group=🌐 默认`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]♻️ 自动`[]🧭 手动`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 默认`[]DIRECT`[]♻️ 自动`[]🧊 冷门`[]🧭 手动`[]🚀 手动选择


; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 国家节点测速组（保持不动）
; ==========================================================
; 全节点（允许任何节点显示）
custom_proxy_group=🧭 手动`select`.*
custom_proxy_group=♻️ 自动`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50
; 冷门节点池（排除 HK/JP/TW/US/SG）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即“冷门”
custom_proxy_group=🧊 冷门`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*

[custom]
; ==========================================================
; 基础配置
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
ruleset=🎨 Adobe,[]GEOSITE,adobe
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 核心应用 ---
ruleset=🤖 AI,[]GEOSITE,category-ai-!cn
ruleset=🤖 AI,[]GEOSITE,google-gemini
ruleset=🤖 AI,[]GEOSITE,openai
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare
ruleset=🎮 Game,[]GEOSITE,steam
ruleset=🎮 Game,[]GEOSITE,epicgames
ruleset=🎮 Game,[]GEOSITE,ea
ruleset=🎮 Game,[]GEOSITE,blizzard
ruleset=🎮 Game,[]GEOSITE,ubisoft
ruleset=🎮 Game,[]GEOSITE,playstation
ruleset=🎮 Game,[]GEOSITE,nintendo
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🔎 Google,[]GEOSITE,google
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🎬 Media,[]GEOSITE,youtube
ruleset=🎬 Media,[]GEOSITE,netflix
ruleset=🎬 Media,[]GEOSITE,disney
ruleset=🎬 Media,[]GEOSITE,hbo
ruleset=🎬 Media,[]GEOSITE,amazon
ruleset=🎬 Media,[]GEOSITE,spotify
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=🚝 Test,[]GEOSITE,category-speedtest
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📞 社交,[]GEOSITE,category-communication
ruleset=📞 社交,[]GEOSITE,twitter
ruleset=📞 社交,[]GEOSITE,category-social-media-!cn
ruleset=👌 虚拟币,[]GEOSITE,okx
ruleset=👌 虚拟币,[]GEOSITE,binance
ruleset=👌 虚拟币,[]GEOSITE,bybit

; --- GFW 兜底 ---
ruleset=🚀 手动,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
;    说明：每个应用都加入「🧊 冷门节点」可选
; ==========================================================
custom_proxy_group=🤖 AI`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=☁️ Cloudflare`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🎮 Game`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🧑‍💻 GitHub`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🔎 Google`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=📸 Instagram`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🎬 Media`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=📨 Telegram`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🚝 Test`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=🎵 TikTok`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=📞 社交`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT
custom_proxy_group=👌 虚拟币`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT

; Adobe：允许一键禁止联网
custom_proxy_group=🎨 Adobe`select`[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]REJECT

; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
;    同时新增：🧊 冷门（只收非 HK/JP/TW/US/SG 的节点）
; ==========================================================

; 兜底“手动选择”（不越权应用，只用于 Default/漏网）
custom_proxy_group=🚀 手动`select`[]♻️ 自动`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 全部`[]DIRECT

; Default 出口（同样允许冷门节点参与）
custom_proxy_group=🌐 默认`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 全部`[]♻️ 自动`[]DIRECT

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 默认`[]DIRECT`[]♻️ 自动`[]🧊 冷门`[]🚀 手动


; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🪐 遵循规则`[]DIRECT
custom_proxy_group=🪐 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 国家节点测速组（保持不动）
; ==========================================================
; 全节点（允许任何节点显示）
custom_proxy_group=🧭 全部`select`.*
custom_proxy_group=♻️ 自动`url-test`.*`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=🇭🇰 香港`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=🇯🇵 日本`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=🇺🇸 美国`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`https://www.gstatic.com/generate_204`300,5,100
; 冷门节点池（排除 HK/JP/TW/US/SG）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即“冷门”
; 注意：按节点名关键词匹配，机场节点名不含地区词时可能混入五大区节点
custom_proxy_group=🧊 冷门`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*

[custom]

; ==========================================================
; 基础配置与节点过滤
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 统一业务组可选项
;
; 使用 Clash 原生 DIRECT / REJECT
; 避免 custom_proxy 创建的 ➡️ 直连 / ⛔ 拒绝
; 在策略组引用时出现 not found。
;
; 业务组不会直接使用 .*，
; 因此不会越权暴露机场全部节点。
; ==========================================================
DEFAULT_GROUPS=[]DIRECT`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]♻️ 自动`[]🌐 默认`[]REJECT


; ==========================================================
; 1. 规则集定义
; ==========================================================


; ----------------------------------------------------------
; Adobe
; ----------------------------------------------------------
ruleset=🎨 Adobe,[]GEOSITE,adobe


; ----------------------------------------------------------
; 私网直连
; ----------------------------------------------------------
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve


; ----------------------------------------------------------
; Aethersailor 自定义直连
; ----------------------------------------------------------
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800


; ----------------------------------------------------------
; 中国大陆直连
; ----------------------------------------------------------
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve


; ----------------------------------------------------------
; 国内可用 / 下载 / BT
; ----------------------------------------------------------
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker


; ==========================================================
; 2. 业务应用
; ==========================================================


; ----------------------------------------------------------
; Telegram
; ----------------------------------------------------------
ruleset=📨 Telegram,[]GEOSITE,telegram
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve


; ----------------------------------------------------------
; AI
; ----------------------------------------------------------
ruleset=🤖 AI,[]GEOSITE,openai


; ----------------------------------------------------------
; Apple
; ----------------------------------------------------------
ruleset=🍎 Apple,[]GEOSITE,apple


; ----------------------------------------------------------
; Media
; ----------------------------------------------------------
ruleset=🎬 Media,[]GEOSITE,youtube
ruleset=🎬 Media,[]GEOSITE,tiktok
ruleset=🎬 Media,[]GEOSITE,netflix
ruleset=🎬 Media,[]GEOSITE,crunchyroll
ruleset=🎬 Media,[]GEOSITE,disney
ruleset=🎬 Media,[]GEOSITE,hbo
ruleset=🎬 Media,[]GEOSITE,amazon
ruleset=🎬 Media,[]GEOSITE,spotify


; ----------------------------------------------------------
; Instagram
; ----------------------------------------------------------
ruleset=📸 Instagram,[]GEOSITE,instagram


; ----------------------------------------------------------
; GitHub
; ----------------------------------------------------------
ruleset=🧑‍💻 GitHub,[]GEOSITE,github


; ----------------------------------------------------------
; 测速
; ----------------------------------------------------------
ruleset=🚝 测速工具,[]GEOSITE,speedtest


; ----------------------------------------------------------
; Games
; ----------------------------------------------------------
ruleset=🎮 Games,[]GEOSITE,steam
ruleset=🎮 Games,[]GEOSITE,epicgames
ruleset=🎮 Games,[]GEOSITE,ea
ruleset=🎮 Games,[]GEOSITE,blizzard
ruleset=🎮 Games,[]GEOSITE,ubisoft
ruleset=🎮 Games,[]GEOSITE,playstation
ruleset=🎮 Games,[]GEOSITE,nintendo


; ----------------------------------------------------------
; 虚拟币
; ----------------------------------------------------------
ruleset=👌 虚拟币,[]GEOSITE,okx
ruleset=👌 虚拟币,[]GEOSITE,binance
ruleset=👌 虚拟币,[]GEOSITE,bybit


; ----------------------------------------------------------
; 即时通讯
; ----------------------------------------------------------
ruleset=📞 即时通讯,[]GEOSITE,category-communication


; ----------------------------------------------------------
; 社交媒体
; ----------------------------------------------------------
ruleset=💬 社交媒体,[]GEOSITE,category-social-media
ruleset=💬 社交媒体,[]GEOSITE,twitter


; ----------------------------------------------------------
; Google
; ----------------------------------------------------------
ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve


; ----------------------------------------------------------
; Microsoft
; ----------------------------------------------------------
ruleset=🪟 Microsoft,[]GEOSITE,microsoft


; ----------------------------------------------------------
; Cloudflare
; ----------------------------------------------------------
ruleset=☁️ Cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ Cloudflare,[]GEOIP,cloudflare,no-resolve


; ==========================================================
; 3. 非标端口
;
; 放在自定义代理和 GFW 之前，
; 让 Custom_Port_Direct 优先匹配。
; ==========================================================
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800


; ==========================================================
; 4. Aethersailor 自定义代理
; ==========================================================
ruleset=🚀 手动,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800


; ==========================================================
; 5. GFW 兜底
; ==========================================================
ruleset=🚀 手动,[]GEOSITE,gfw


; ==========================================================
; 6. 最终兜底
; ==========================================================
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 7. 业务策略组
;
; 所有业务组统一使用 DEFAULT_GROUPS。
; ==========================================================

custom_proxy_group=🤖 AI`select`$DEFAULT_GROUPS
custom_proxy_group=🍎 Apple`select`$DEFAULT_GROUPS
custom_proxy_group=☁️ Cloudflare`select`$DEFAULT_GROUPS
custom_proxy_group=🧑‍💻 GitHub`select`$DEFAULT_GROUPS
custom_proxy_group=🎮 Games`select`$DEFAULT_GROUPS
custom_proxy_group=🔎 Google`select`$DEFAULT_GROUPS
custom_proxy_group=🪟 Microsoft`select`$DEFAULT_GROUPS
custom_proxy_group=🎬 Media`select`$DEFAULT_GROUPS
custom_proxy_group=📨 Telegram`select`$DEFAULT_GROUPS
custom_proxy_group=📸 Instagram`select`$DEFAULT_GROUPS
custom_proxy_group=📞 即时通讯`select`$DEFAULT_GROUPS
custom_proxy_group=💬 社交媒体`select`$DEFAULT_GROUPS
custom_proxy_group=🚝 测速工具`select`$DEFAULT_GROUPS
custom_proxy_group=👌 虚拟币`select`$DEFAULT_GROUPS
custom_proxy_group=🎨 Adobe`select`$DEFAULT_GROUPS


; ==========================================================
; 8. 出口策略组
; ==========================================================


; ----------------------------------------------------------
; 🚀 手动
; ----------------------------------------------------------
custom_proxy_group=🚀 手动`select`[]♻️ 自动`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]🧭 手动`[]DIRECT`[]REJECT


; ----------------------------------------------------------
; 🌐 默认
; ----------------------------------------------------------
custom_proxy_group=🌐 默认`select`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门`[]♻️ 自动`[]🧭 手动`[]DIRECT`[]REJECT


; ----------------------------------------------------------
; 🐟 漏网之鱼
; ----------------------------------------------------------
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 默认`[]♻️ 自动`[]🧊 冷门`[]🧭 手动`[]🚀 手动`[]DIRECT


; ----------------------------------------------------------
; 🔀 非标端口
; ----------------------------------------------------------
custom_proxy_group=🔀 非标端口`select`[]🪐 遵循规则`[]DIRECT


; ----------------------------------------------------------
; 🪐 遵循规则
; ----------------------------------------------------------
custom_proxy_group=🪐 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 9. 节点池与地区自动测速
; ==========================================================


; ----------------------------------------------------------
; 🧭 手动
; ----------------------------------------------------------
custom_proxy_group=🧭 手动`select`.*


; ----------------------------------------------------------
; ♻️ 自动
; ----------------------------------------------------------
custom_proxy_group=♻️ 自动`url-test`.*`https://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🇭🇰 香港
; ----------------------------------------------------------
custom_proxy_group=🇭🇰 香港`url-test`(?i)(香港|HK|Hong[\s_-]?Kong)`http://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🇹🇼 台湾
; ----------------------------------------------------------
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(台湾|TW|Taiwan|Taipei|Hinet)`http://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🇯🇵 日本
; ----------------------------------------------------------
custom_proxy_group=🇯🇵 日本`url-test`(?i)(日本|JP|Japan|Tokyo|Osaka)`http://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🇸🇬 新加坡
; ----------------------------------------------------------
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🇺🇸 美国
; ----------------------------------------------------------
custom_proxy_group=🇺🇸 美国`url-test`(?i)(美国|US|United[\s_-]?States|Los[\s_-]?Angeles|San[\s_-]?Jose|Seattle|New[\s_-]?York)`http://www.gstatic.com/generate_204`300,50,50


; ----------------------------------------------------------
; 🧊 冷门
; 排除 HK / TW / JP / SG / US
; ----------------------------------------------------------
custom_proxy_group=🧊 冷门`url-test`(?i)^(?!.*(香港|HK|Hong[\s_-]?Kong|台湾|TW|Taiwan|Taipei|Hinet|日本|JP|Japan|Tokyo|Osaka|新加坡|SG|Singapore|美国|US|United[\s_-]?States|Los[\s_-]?Angeles|San[\s_-]?Jose|Seattle|New[\s_-]?York)).*`http://www.gstatic.com/generate_204`300,50,50
